<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7efe3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>Малыши — Тамагочи</title></head><body><main id="app"><header><div><small class="eyebrow">КАРМАННЫЕ ДРУЗЬЯ</small><h1>Малыши<span>✦</span></h1></div><button id="settings" class="round" aria-label="Настройки">⚙</button></header><section id="choose" class="sheet" hidden><div class="intro"><small>ТВОЯ МАЛЕНЬКАЯ ИСТОРИЯ</small><h2>Кого поселим дома?</h2><p>Три друга, три характера. Выбирай сердцем!</p></div><div id="cards"></div><p class="fine">У каждого питомца свой прогресс. Можно вернуться к любому из них.</p></section><section id="game" hidden><div class="identity"><div><div class="tiny" id="species"></div><h2 id="petname"></h2><div id="age" class="fine"></div></div><button id="switch" class="pill">↔ Питомцы</button></div><div class="room pet-garden" id="room"><div class="room-top"><span id="timeLabel">☀ День</span><span id="level">♥ 1 уровень</span></div><div id="speech" role="status"></div><div id="pet" tabindex="0" role="button" aria-label="Погладить питомца"></div><div id="poop" aria-label="Нужно убрать" hidden>💩</div><div id="effect" aria-hidden="true"></div><div class="room-bottom"><span id="roomMood"></span><button id="petTap" class="mini">♡ Погладить</button></div></div><div id="stats" class="stats"></div><div class="sectionline"><h3>Уход за питомцем</h3><span id="coins">✦ 0</span></div><div class="actions" id="actions"></div><div class="journal"><div><small>СЛЕДУЮЩИЙ УХОД</small><strong id="nextCare"></strong></div><div class="clock">◷</div></div><footer>Твой малыш растёт даже когда приложение закрыто. · v1.1</footer></section></main><dialog id="modal"><form method="dialog"><button class="close" value="cancel" aria-label="Закрыть">×</button></form><div id="modalBody"></div></dialog><div id="toast" role="status" hidden></div><script src="game.js" defer></script></body></html>
